<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ESDICA 360 - Visita Virtual</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    :root {
      --aec-red: #8b0000;
      --aec-gray-light: #fafafa; 
      --aec-gray-border: #eee;   
      --text-dark: #333;
    }

    /* Estilos originais mantidos */
    .header { 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-bottom: none !important; 
      margin-bottom: 10px; 
      padding: 10px 0;
    }
    
    .logo { height: 75px; width: auto; margin-bottom: 2px; }
    .title { color: var(--aec-red); font-weight: 700; font-size: 1.3rem; margin: 0; line-height: 1; }

    .categories-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 15px;
      max-width: 320px; 
      margin: 0 auto;
    }

    .cat-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: var(--aec-red);
      border: 1px solid var(--aec-red);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 5px;
    }

    .cat-btn i.main-icon { font-size: 1.5rem; color: #ffffff; margin-bottom: 5px; } 
    .cat-btn span { font-weight: 500; font-size: 0.8rem; color: #ffffff; text-align: center; line-height: 1.1; } 
    
    .cat-btn.active { background-color: #ffffff; border-color: var(--aec-red); }
    .cat-btn.active i.main-icon, .cat-btn.active span { color: var(--aec-red); }

    .category-content {
      display: none;
      grid-column: 1 / -1; 
      padding: 5px 8px;
      background: var(--aec-gray-light);
      border-radius: 12px;
      margin: 5px 0 10px 0;
      border: 1px solid var(--aec-gray-border);
      animation: fadeIn 0.3s ease-out;
    }
    .category-content.active { display: block; }

    .grid { 
      display: grid; 
      grid-template-columns: 1fr; 
      gap: 8px; 
      margin: 0 !important;
      padding: 0 !important;
    }
    
    .card {
      margin: 0 !important;
      padding: 10px !important;
    }
    
    .card h3 { font-size: 0.8rem !important; font-weight: 600; margin: 0 0 2px 0 !important; } 
    .card p { font-size: 0.75rem; line-height: 1.2; margin: 0 !important; }   
    .card .icon i { font-size: 1rem; }                  

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #backToTop {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background-color: var(--aec-red);
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0.7;
    }

    /* ALTERAÇÃO: Rodapé com Logos nas pontas */
    .footer { 
      display: flex; 
      justify-content: space-between; /* Um para a esquerda, outro para a direita */
      align-items: center;
      padding: 15px 15px 30px 15px; 
      border-top: none !important; 
    }
    .footer img { height: 32px; opacity: 1 !important; }

    @media (min-width: 600px) {
      .categories-grid { grid-template-columns: repeat(3, 110px); max-width: 400px; }
      .grid { grid-template-columns: repeat(2, 1fr); } 
    }

    /* Estilos do iOS Prompt mantidos */
    #ios-prompt {
      display: none; 
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: white;
      color: black;
      padding: 15px;
      border-radius: 16px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      border: 1px solid rgba(0,0,0,0.1);
      animation: slideUp 0.5s ease-out;
    }
    @keyframes slideUp { from { bottom: -100px; opacity: 0; } to { bottom: 20px; opacity: 1; } }
  </style>
</head>

<body>
  
  <div id="ios-prompt">
    <p style="margin: 0; font-size: 14px; line-height: 1.4;">
      <strong>Instala no teu iPhone:</strong><br>
      Clica no ícone <strong>Partilhar</strong> e depois em <strong>"Ecrã Principal"</strong>.
    </p>
    <button onclick="document.getElementById('ios-prompt').style.display='none'" style="margin-top: 10px; border: none; background: #007aff; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer;">Fechar</button>
  </div>

  <button id="backToTop" onclick="scrollToTop()">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <div class="container">
    <header class="header">
      <img src="assets/images/logo.png" alt="Logo ESDICA" class="logo"/>
      <h1 class="title">ESDICA 360</h1>
    </header>

    <main class="categories-grid">
      </main>

    <footer class="footer">
      <a href="https://www.aecister.pt" target="_blank">
        <img src="assets/images/logo_Agr.png" alt="AECISTER">
      </a>

      <a href="#">
        <img src="assets/images/logo_cte.png" alt="Logo CTE">
      </a>
    </footer>
  </div>

  <script>
    // Scripts originais mantidos
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              window.location.reload(); 
            }
          });
        });
      });
    }

    const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
    if (isIos && !isStandalone) {
      document.getElementById('ios-prompt').style.display = 'block';
    }

    const btt = document.getElementById("backToTop");
    window.onscroll = function() {
      if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
        btt.style.display = "flex";
      } else {
        btt.style.display = "none";
      }
    };
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', function() {
      const buttons = document.querySelectorAll('.cat-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', function() {
          const targetId = this.getAttribute('data-target');
          const targetContent = document.getElementById(targetId);
          const wasActive = this.classList.contains('active');

          buttons.forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.category-content').forEach(c => c.classList.remove('active'));

          if (!wasActive) {
            this.classList.add('active');
            targetContent.classList.add('active');
            setTimeout(() => {
              targetContent.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
          }
        });
      });
    });
  </script>
</body>
</html>
