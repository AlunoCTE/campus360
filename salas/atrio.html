<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Átrio — ESDICA 360</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
  <style>
    :root {
      --cor-logo: #8B0000; /* Grená ESDICA */
    }

    #panorama {
      width: 100%;
      height: 600px;
    }

    /* Estilo do botão 'i' para parecer nativo do Pannellum */
    .pnlm-info-btn {
      width: 26px;
      height: 26px;
      background: var(--cor-logo);
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: "Times New Roman", serif;
      font-weight: bold;
      font-style: italic;
      font-size: 16px;
      border: 1px solid rgba(255,255,255,0.3);
      margin-top: 2px; /* Espaço pequeno entre o botão de zoom e o 'i' */
      pointer-events: auto !important; /* Garante que o clique funciona */
    }

    .pnlm-info-btn:hover {
      background-color: #5a0000;
    }

    /* Mantém o grupo de controlos original unido */
    .pnlm-controls-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <a href="../index.html"><img src="../assets/images/logo.png" alt="Logo" class="logo"/></a>
      <div>
        <div class="title">ESDICA 360</div>
        <div class="subtitle">Átrio</div>
      </div>
    </header>

    <section class="viewer-wrap">
      <div id="panorama"></div>
    </section>

    <div class="room-header">
      <h2>Átrio</h2>
      <div><a href="../index.html" class="btn">Voltar</a></div>
    </div>

    <footer class="footer">
        <a href="https://www.aecister.pt" target="_blank" rel="noopener noreferrer">
          <img src="../assets/images/logo_Agr.png" alt="AECISTER" style="height:30px;">
        </a>
    </footer>
  </div>

  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-hidden="true">
    <div class="modal" role="document">
      <button id="modal-close" style="float:right;border:none;background:none;font-size:20px;cursor:pointer">✕</button>
      <h2 id="modal-title">Título</h2>
      <p id="modal-text">Descrição</p>
      <div style="text-align:right">
        <button id="modal-video-btn" class="btn">Ver Vídeo</button>
      </div>
    </div>
  </div>

  <div id="video-overlay" class="video-overlay" role="dialog" aria-hidden="true">
    <button id="video-close" style="position:absolute;z-index:130;right:14px;top:14px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.9);border:none;cursor:pointer">Fechar</button>
    <video id="overlay-video" controls playsinline></video>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <script src="../assets/js/script.js"></script>
  <script>
    // Inicializa o viewer
    const viewer = pannellum.viewer('panorama', {
        "type": "equirectangular",
        "panorama": "../assets/panoramas/atrio.jpg",
        "autoLoad": true,
        "showControls": true
    });

    // Função para injetar o botão 'i' logo abaixo dos controlos
    viewer.on('load', function() {
        const ctrlContainer = document.querySelector('.pnlm-controls-container');
        
        if (ctrlContainer && !document.querySelector('.pnlm-info-btn')) {
            const infoBtn = document.createElement('div');
            infoBtn.className = 'pnlm-info-btn';
            infoBtn.innerHTML = 'i';
            
            // Injeta o botão no contentor de controlos
            ctrlContainer.appendChild(infoBtn);

            const info = {
                title: "Átrio",
                text: "Bem-vindo! Este é o ponto de partida da tua visita virtual. A partir daqui podes explorar os diferentes espaços da escola e descobrir onde os alunos aprendem, criam e convivem. A tua história começa aqui. O campus espera por ti! Preparado...? Um clique… e estás dentro!",
                video: "../assets/videos/atrio.mp4"
            };

            // Usamos 'mousedown' ou 'click' com stopPropagation para garantir que a modal abre
            infoBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation(); // Impede o Pannellum de ignorar o clique
                if (typeof openModal === 'function') {
                    openModal(info.title, info.text, info.video);
                }
            });
        }
    });
  </script>
</body>
</html>
