<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Átrio — ESDICA 360</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
  <style>
    /* Cor do Logótipo ESDICA */
    :root {
      --cor-logo: #8B0000; 
    }

    #panorama {
      width: 100%;
      height: 600px;
      position: relative;
    }

    /* Estilo para o novo botão 'i' dentro do Pannellum */
    .pnlm-info-btn {
        width: 26px;
        height: 26px;
        background: var(--cor-logo);
        position: absolute;
        bottom: 0; /* Ficará abaixo dos outros no container de controlos */
        right: 0;
        border-radius: 3px;
        cursor: pointer;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: "Times New Roman", serif;
        font-weight: bold;
        font-style: italic;
        font-size: 18px;
        border: 1px solid rgba(255,255,255,0.3);
    }

    .pnlm-info-btn:hover {
        background-color: #5a0000;
    }

    /* Ajuste para subir os botões nativos e dar lugar ao 'i' */
    .pnlm-zoom-controls {
        margin-bottom: 35px !important;
    }
    .pnlm-fullscreen-toggle-button {
        margin-bottom: 35px !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <a href="../index.html"><img src="../assets/images/logo.png" alt="Logo" class="logo"/></a>
      <div>
        <div class="title">ESDICA 360</div>
        <div class="subtitle">Átrio</div>
      </div>
    </header>

    <section class="viewer-wrap">
      <div id="panorama"></div>
    </section>

    <div class="room-header">
      <h2>Átrio</h2>
      <div><a href="../index.html" class="btn">Voltar</a></div>
    </div>

    <footer class="footer">
        <a href="https://www.aecister.pt" target="_blank" rel="noopener noreferrer">
          <img src="../assets/images/logo_Agr.png" alt="AECISTER" style="height:30px;">
        </a>
    </footer>
  </div>

  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-hidden="true">
    <div class="modal" role="document">
      <button id="modal-close" style="float:right;border:none;background:none;font-size:20px;cursor:pointer">✕</button>
      <h2 id="modal-title">Título</h2>
      <p id="modal-text">Descrição</p>
      <div style="text-align:right">
        <button id="modal-video-btn" class="btn">Ver Vídeo</button>
      </div>
    </div>
  </div>

  <div id="video-overlay" class="video-overlay" role="dialog" aria-hidden="true">
    <button id="video-close" style="position:absolute;z-index:130;right:14px;top:14px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.9);border:none;cursor:pointer">Fechar</button>
    <video id="overlay-video" controls playsinline></video>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <script src="../assets/js/script.js"></script>
  <script>
    // 1. Inicializa o visualizador normalmente
    initViewer("../assets/panoramas/atrio.jpg", []);

    // 2. Criação dinâmica do botão para garantir que ele aparece e funciona
    window.addEventListener('load', function() {
        const ctrlContainer = document.querySelector('.pnlm-controls-container');
        
        if (ctrlContainer) {
            const infoBtn = document.createElement('div');
            infoBtn.className = 'pnlm-info-btn';
            infoBtn.innerHTML = 'i';
            infoBtn.title = 'Informação do Espaço';
            
            // Adiciona o botão ao contentor de controlos do Pannellum
            ctrlContainer.appendChild(infoBtn);

            // Dados da modal
            const info = {
                title: "Átrio",
                text: "Bem-vindo! Este é o ponto de partida da tua visita virtual. A partir daqui podes explorar os diferentes espaços da escola e descobrir onde os alunos aprendem, criam e convivem. A tua história começa aqui. O campus espera por ti! Preparado...? Um clique… e estás dentro!",
                video: "../assets/videos/atrio.mp4"
            };

            // Evento de clique corrigido
            infoBtn.addEventListener('click', function() {
                if (typeof openModal === 'function') {
                    openModal(info.title, info.text, info.video);
                } else {
                    console.error("Função openModal não encontrada no script.js");
                }
            });
        }
    });
  </script>
</body>
</html>
